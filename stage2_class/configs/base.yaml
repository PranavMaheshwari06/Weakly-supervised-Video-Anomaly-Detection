seed: 1337
device: cuda
precision: fp16

paths:
  repo_root: /home/pranavmaheshwari/Pranav_master_thesis/master_thesis_crowd_anomaly
  feature_store_root: data/ucf_crime/artifacts/dman_v21/features
  splits_root: data/ucf_crime/splits/dman_v21
  videos_index_jsonl: data/ucf_crime/artifacts/dman_v21/clip_index/videos.jsonl

stage1:
  global_dim: 768
  patch_dim: 768
  patch_patches: 196

io:
  max_shards_to_scan: -1   # -1 means all; use small number when testing quickly
  write_dir_results: results/stage2
  write_dir_logs: logs/stage2

train:
  epochs: 40
   
  batch_size_videos: 8
  learning_rate: 0.0001
  early_stop_patience : 8
  early_stop_min_detlta : 1e-4
  weight_decay: 0.01
  grad_clip_norm: 1.0
  eval_every: 1
  num_workers: 0
  pin_memory: false
  save_dir_checkpoints: checkpoints/stage2

stage2:
  num_classes: 14
  bag_size: 16
  warmup_epochs: 2
  mixture_uniform_ratio: 0.5
  top_fraction: 0.25
